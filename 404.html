<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121722">
  <title>Page not found | Jaber Ziv Pamittan</title>
  <meta name="robots" content="noindex">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23121722'/%3E%3Ctext x='50' y='68' font-family='monospace' font-size='58' font-weight='700' fill='%238fb0ff' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

  <script>
    document.documentElement.classList.add('js');
    try {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) { /* ignore */ }
  </script>

  <link rel="stylesheet" href="style.css">
  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 6rem);
      padding-block: 4rem;
      text-align: center;
    }

    .error-code {
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 1rem;
      letter-spacing: 0.08em;
    }

    .error-page h1 {
      margin: 0.5rem 0 1rem;
    }

    .error-page p {
      max-width: 32rem;
      color: var(--muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <header class="site-header">
    <div class="wrap bar">
      <a class="site-name" href="/">Jaber Ziv Pamittan</a>
      <div class="header-controls">
        <button class="theme-toggle" id="themeToggle" aria-label="Switch to light theme">
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M17.3 13.4A7.4 7.4 0 0 1 8.1 4.2c.15-.47-.32-.9-.77-.68a8.5 8.5 0 1 0 10.6 11.5c.2-.46-.25-.9-.63-.62Z"/>
          </svg>
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <circle cx="10" cy="10" r="3.6"/>
            <path d="M10 1.8v2M10 16.2v2M18.2 10h-2M3.8 10h-2M15.6 4.4l-1.4 1.4M5.8 14.2l-1.4 1.4M15.6 15.6l-1.4-1.4M5.8 5.8 4.4 4.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap error-page">
    <p class="error-code">ERROR 404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist, or the link may be broken. Let's get you back to somewhere useful.</p>
    <p class="actions">
      <a class="button" href="/">Back to home</a>
      <a class="button button-quiet" href="/#projects">See my projects</a>
    </p>
  </main>

  <footer class="site-footer wrap">
    <p>&copy; 2026 Jaber Ziv Pamittan</p>
  </footer>

  <script>
    (function () {
      var themeToggle = document.getElementById('themeToggle');
      if (themeToggle) {
        themeToggle.addEventListener('click', function () {
          var isLight = document.documentElement.getAttribute('data-theme') === 'light';
          if (isLight) {
            document.documentElement.removeAttribute('data-theme');
            themeToggle.setAttribute('aria-label', 'Switch to light theme');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            themeToggle.setAttribute('aria-label', 'Switch to dark theme');
          }
          try { localStorage.setItem('theme', isLight ? 'dark' : 'light'); } catch (e) { /* ignore */ }
        });
        if (document.documentElement.getAttribute('data-theme') === 'light') {
          themeToggle.setAttribute('aria-label', 'Switch to dark theme');
        }
      }
    })();
  </script>

</body>
</html>
